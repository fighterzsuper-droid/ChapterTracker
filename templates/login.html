<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Jay Study Hub</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="hub-auth-page">
<main class="hub-auth-card card">
  <div class="brand-mark">J</div>
  <span class="eyebrow">PRIVATE STUDY WORKSPACE</span>
  <h1>Jay Study Hub</h1>
  <p class="muted">Enter your access password to view your study time and ACCA progress.</p>
  {% if error %}<p class="hub-login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}" class="hub-login-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="button" type="submit">Sign in</button>
  </form>
</main>
</body></html>
