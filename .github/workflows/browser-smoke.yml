name: Browser Study Board Check

on:
  push:
    branches: ["feature/study-board-pdf-spreadsheet", "feature/expand-study-board"]
  workflow_dispatch:

jobs:
  browser-study-board:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and browser runner
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start private Study Hub
        env:
          HUB_ACCESS_PASSWORD: browser-test-password
          FLASK_SECRET_KEY: this-is-not-a-production-secret-for-tests
          HUB_ALLOW_HTTP: '1'
          AA_DB_PATH: /tmp/jay-browser-aa.db
          TX_DB_PATH: /tmp/jay-browser-tx.db
          STUDY_TIME_DB_PATH: /tmp/jay-browser-time.db
          BOARD_STORAGE_PATH: /tmp/jay-browser-files
        run: |
          python app.py > /tmp/jay-browser-server.log 2>&1 &
          sleep 4
          curl --fail http://127.0.0.1:5000/health
      - name: Check browser loads Univer Sheets and PDF split view
        run: python scripts/browser_smoke.py
