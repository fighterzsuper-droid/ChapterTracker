name: Verify F7 Portal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py topic_tests.py github_deploy.py test_github_deploy.py
      - run: python -m unittest -v test_github_deploy
      - name: Verify chapter question bank and authenticated topic-test submission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import app
          from topic_tests import PAGE
          bank = json.loads(Path('fr_topic_tests.json').read_text())
          q = bank['quizzes'][0]
          questions = q['questions']
          assert len(questions) == 14
          assert sum(item['marks'] for item in questions) == 40
          assert sum(item['type'] == 'mcq' for item in questions) == 12
          assert sum(item['type'] == 'written' for item in questions) == 2
          assert all(len(item.get('options', [])) == 4 for item in questions[:12])
          with app.app.test_client() as client:
              assert client.get('/topic-tests').status_code == 302
              conn = app.db_connect()
              now = app.utc_now()
              cur = conn.execute("INSERT INTO users (username,email,display_name,created_at,updated_at) VALUES (?,?,?,?,?)", ('ci-fr-test', 'ci@example.invalid', 'CI Test', now, now))
              conn.commit()
              user_id = cur.lastrowid
              conn.close()
              with client.session_transaction() as s:
                  s['user_id'] = user_id
              resp = client.get('/topic-tests')
              assert resp.status_code == 200, resp.status_code
              assert b'Chapter practice tests' in resp.data
              listing = client.get('/api/topic-tests').get_json()
              assert any(x['id'] == q['id'] for x in listing['quizzes'])
              served = client.get('/api/topic-tests/' + q['id']).get_json()
              assert len(served['quiz']['questions']) == 14
              assert all('answer' not in item and 'marking_guide' not in item for item in served['quiz']['questions'])
              with client.session_transaction() as s:
                  csrf = s['csrf_token']
              answers = {item['id']: item['answer'] if item['type'] == 'mcq' else 'Scenario-specific calculations and conclusions for manual marking.' for item in questions}
              resp = client.post('/api/topic-tests/' + q['id'] + '/submit', json={'answers': answers}, headers={'X-CSRF-Token': csrf})
              assert resp.status_code == 200, (resp.status_code, resp.data)
              assert resp.get_json()['objective_score'] == 24
              aid = resp.get_json()['attempt_id']
              review = client.get('/api/topic-tests/submissions/' + str(aid)).get_json()
              assert review['objective_score'] == 24
              assert len(review['answers']) == 14
              assert len(client.get('/api/topic-tests/history').get_json()['attempts']) == 1
          Path('/tmp/topic-tests.js').write_text(PAGE.split('<script>',1)[1].split('</script>',1)[0], encoding='utf-8')
          print('Authenticated topic test routes + answer submission OK')
          PY
          node --check /tmp/topic-tests.js
      - name: Verify FR portal package
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          raw=b''.join(Path(f'fr_portal_v7.gz.part{i}').read_bytes() for i in range(4))
          html=gzip.decompress(raw).decode('utf-8')
          assert 'FR / F7' in html
          assert 'Mock Exams' in html
          assert 'timerBox' in html
          assert 'Management' in html
          print('F7 portal package OK:',len(html),'bytes')
          PY

      - name: Inspect existing mock-exam navigation transitions
        run: |
          python - <<'PY'
          import gzip,re
          from pathlib import Path
          raw=b''.join(Path(f'fr_portal_v7.gz.part{i}').read_bytes() for i in range(4))
          html=gzip.decompress(raw).decode('utf-8')
          print('EXAM_RUNTIME_DEBUG_START')
          pattern = re.compile(r'function\s+[A-Za-z_$][\w$]*\s*\(')
          for match in pattern.finditer(html):
              name=match.group(0)
              if re.search(r'exam|mock|exit|end|submit|finish|review|navigator|score|attempt|result|start|resume|leave|jump|goTo|question',name,re.I):
                  print('MATCH',name[:85], 'at',match.start(), re.sub(r'\s+',' ',html[match.start():match.start()+350])[:350])
          for token in ['exitExam(', 'finishExam(', 'submitExam(', 'launchMock(', 'resumeExam(', 'confirmExit', 'finishMock(', 'showResults(', 'navigateQuestion(', 'currentQuestion', 'state.history.push(', 'history.push(']:
              count=0
              for match in re.finditer(re.escape(token),html):
                  count+=1
                  if count<=6: print('REFERENCE',token,'at',match.start(),re.sub(r'\s+',' ',html[max(0,match.start()-120):match.start()+180])[:300])
              print('COUNT',token,count)
          print('EXAM_RUNTIME_DEBUG_END')
          PY
      - name: Verify served portal JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import app
          fake_user = {
              "id": 1,
              "username": "jay",
              "email": "Jayakiran804@gmail.com",
              "display_name": "Jayakiran",
              "password_hash": "",
              "google_sub": "test-google-sub",
              "avatar": "",
              "google_picture": "",
              "created_at": "",
              "updated_at": "",
          }
          html = app.portal_html_for(fake_user)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          Path("/tmp/portal-scripts.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("Extracted", len(scripts), "script blocks")
          PY
          node --check /tmp/portal-scripts.js
