name: Verify F7 Portal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py
      - name: Verify FR portal package
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          raw=b''.join(Path(f'fr_portal_v7.gz.part{i}').read_bytes() for i in range(4))
          html=gzip.decompress(raw).decode('utf-8')
          assert 'FR / F7' in html
          assert 'Mock Exams' in html
          assert 'timerBox' in html
          assert 'Management' in html
          print('F7 portal package OK:',len(html),'bytes')
          PY
