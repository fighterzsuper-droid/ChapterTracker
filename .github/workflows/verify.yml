name: Verify Jay Study Hub

on:
  push:
    branches: [main, "feature/focused-study-timer", "rebuild/jay-study-hub-clean", "feature/study-board-pdf-spreadsheet", "feature/expand-study-board"]
  pull_request:

jobs:
  study-timer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q app.py tx_hub.py study_time.py watcher.py board.py security.py
      - name: Check browser JavaScript syntax
        run: |
          node --check static/study_board.js
          node --check static/pdf_viewer.js
          node --check static/study_time.js
      - name: Check pinned spreadsheet and PDF libraries
        run: python scripts/check_board_assets.py
